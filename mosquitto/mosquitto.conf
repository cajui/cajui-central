listener 1883
allow_anonymous false
password_file /mosquitto/auth/passwords
acl_file /mosquitto/auth/acl
persistence true
persistence_location /mosquitto/data/
max_packet_size 32768
log_dest stdout
# Central keeps a persistent session: the broker queues its samples while it is away.
# Sessions of clients gone for a week are discarded; each client queues at most 1000
# messages. Frequent autosave limits what a broker crash (not a restart) can lose.
persistent_client_expiration 7d
max_queued_messages 1000
autosave_interval 60
