name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go mod verify
      - run: make check
      - run: make build
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test-compose

  mqtt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/test_mqtt.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mqtt-coverage
          path: coverage.out
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -v

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-locales.txt
      - run: python3 scripts/compile_locales.py --check
      - run: python3 -m unittest discover -s tests -p test_locales.py -v
      - run: npm ci --prefix tests/ui --ignore-scripts
      - run: make check-ui
      - run: npx playwright install --with-deps chromium
        working-directory: tests/ui
      - run: make build test-ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-results
          path: tests/ui/test-results
