# Local development only. Plain MQTT is confined to this host and Docker network.
services:
  broker-init:
    image: eclipse-mosquitto:2.0.22
    user: root
    entrypoint: [sh, /init-auth.sh]
    volumes:
      - ./examples/mqtt/init-auth.sh:/init-auth.sh:ro
      - ./.local-mqtt:/run/secrets:ro
      - broker-auth:/auth
  broker:
    image: eclipse-mosquitto:2.0.22
    depends_on:
      broker-init:
        condition: service_completed_successfully
    ports: ["127.0.0.1:${CAJUI_MQTT_PORT:-1883}:1883"]
    volumes:
      - ./examples/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./examples/mqtt/acl:/mosquitto/config/acl:ro
      - broker-auth:/auth:ro
      - broker-data:/mosquitto/data
    restart: unless-stopped
  cajui:
    build: .
    depends_on: [broker]
    ports: ["127.0.0.1:${CAJUI_PORT:-8080}:8080"]
    environment:
      CAJUI_API_TOKEN_FILE: /run/secrets/api-token
      CAJUI_MQTT_URL: tcp://broker:1883
      CAJUI_MQTT_ALLOW_PLAINTEXT: "1"
      CAJUI_MQTT_USERNAME: central
      CAJUI_MQTT_PASSWORD_FILE: /run/secrets/central
    volumes:
      - ./.local-mqtt/api-token:/run/secrets/api-token:ro
      - ./.local-mqtt/central:/run/secrets/central:ro
      - mqtt-central-data:/data
    restart: unless-stopped
  publish:
    image: eclipse-mosquitto:2.0.22
    profiles: [tools]
    entrypoint: [mosquitto_pub]
    command: ["-h", broker, "-q", "1", "-t", telemetry/v1/demo-source/demo-device/samples, "-f", /examples/sample.json]
    environment:
      XDG_CONFIG_HOME: /client-config
    volumes:
      - ./.local-mqtt/mosquitto_pub:/client-config/mosquitto_pub:ro
      - ./examples/mqtt:/examples:ro
volumes:
  broker-auth:
  broker-data:
  mqtt-central-data:
